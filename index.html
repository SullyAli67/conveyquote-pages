          "@type": "Question",
          "name": "How much does conveyancing cost in the UK?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "For a straightforward residential purchase in England and Wales, expect total conveyancing costs of roughly £1,500 to £2,500. That is made up of the solicitor's legal fee — typically £900 to £1,500 plus VAT — and disbursements, which are third-party costs such as searches and Land Registry fees. Selling usually costs less, around £900 to £1,500 in total, and leasehold properties cost more because extra legal work is involved. A reviewed, itemised quote shows your exact figure before you commit to anything."
          }
        },
        {
          "@type": "Question",
          "name": "How long does conveyancing take?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Most transactions complete within ten to fourteen weeks of an offer being accepted, and around twelve weeks is a realistic average. Leasehold purchases, long chains and new-build developer deadlines can extend this, while a simple freehold sale with no chain can be quicker. A proactive solicitor who chases the other side regularly is the biggest single factor in keeping things moving."
          }
        },
        {
          "@type": "Question",
          "name": "What is included in a conveyancing quote?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "A proper conveyancing quote itemises three things: the legal fee for the solicitor's work (plus VAT), the disbursements — third-party costs such as local authority searches, Land Registry fees and bank transfer charges — and a Stamp Duty estimate where it applies. ConveyQuote quotes are fixed and reviewed by our team before they are issued, so nothing is added later without explanation."
          }
        },
        {
          "@type": "Question",
          "name": "Do I need a solicitor to buy a house?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "If you are buying with a mortgage, yes in practice — your lender will require a solicitor or licensed conveyancer to act for them before releasing funds. Cash buyers can legally do their own conveyancing, but it is risky: searches, contracts and Land Registry registration carry real legal consequences if they are mishandled. In practice nearly all buyers instruct a regulated professional."
          }
        },
        {
          "@type": "Question",
          "name": "What is the difference between freehold and leasehold conveyancing?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Freehold means you own the building and the land it stands on outright. Leasehold means you own the property for the length of a lease and usually pay ground rent and service charges to a freeholder. Leasehold conveyancing involves extra work — reviewing the lease, the management pack and the service charge accounts — so it typically costs more and takes a few weeks longer."
          }
        }
      ]
    }
